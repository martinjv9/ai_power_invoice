services:
  db:
    image: postgres:16
    container_name: invoice_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: invoice
      POSTGRES_PASSWORD: invoice
      POSTGRES_DB: invoice
    ports:
      - "5432:5432"
    volumes:
      - invoice_pgdata:/var/lib/postgresql/data

volumes:
  invoice_pgdata:
