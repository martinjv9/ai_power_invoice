# Minimal CI: lint, test, build, and smoke-check the built api on every push/PR.
# This is deliberately test-only — deploy automation (images → ECR → deploy) is
# added later in Infra Phase C and extends this workflow rather than replacing it.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest

    # Same Postgres the local docker-compose runs — the api's integration
    # tests (auth/sessions) talk to a real database, in CI too.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: invoice
          POSTGRES_PASSWORD: invoice
          POSTGRES_DB: invoice
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U invoice -d invoice"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://invoice:invoice@localhost:5432/invoice?schema=public

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run prisma:generate -w @invoice/api

      - name: Apply database migrations
        run: npx prisma migrate deploy
        working-directory: apps/api

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      # Boots the compiled api (`node dist/index.js`) and hits /health. Catches
      # production-only breakage that dev tooling (tsx/vitest) papers over.
      - name: Smoke-check built api
        run: npm run smoke
